<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gold Workshop - Offline</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0f172a;
        color: #f8fafc;
      }
      .offline-shell {
        max-width: 520px;
        text-align: center;
        padding: 2rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 20px 80px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin-bottom: 1rem;
        font-size: 2rem;
      }
      p {
        color: #cbd5e1;
        line-height: 1.7;
      }
      a {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="offline-shell">
      <h1>Offline Mode Enabled</h1>
      <p>
        The app is currently offline. You can still create invoices and customer records.
        Your changes are stored locally and will sync automatically when your connection returns.
      </p>
      <p>
        <a href="/">Return to the app</a>
      </p>
    </div>
  </body>
</html>
